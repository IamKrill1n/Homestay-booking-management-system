services:
  # 1. Local PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: project_db
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_booking_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Node.js Express Backend (Upgraded to Node 20)
  backend:
    image: node:20-alpine
    container_name: project_backend
    working_dir: /usr/src/app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://dev_user:dev_password@db:5432/dev_booking_db
    depends_on:
      - db

  # 3. Vite + React Frontend (Upgraded to Node 20)
  frontend:
    image: node:20-alpine
    container_name: project_frontend
    working_dir: /usr/src/app
    command: sh -c "npm install && npx vite --host"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:5001
    depends_on:
      - backend

volumes:
  pgdata: