version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: project_db
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_booking_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: node:18-alpine
    container_name: project_backend
    working_dir: /usr/src/app
    command: npm run dev
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://dev_user:dev_password@db:5432/dev_booking_db
    depends_on:
      - db

  frontend:
    image: node:18-alpine
    container_name: project_frontend
    working_dir: /usr/src/app
    command: npm start
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  pgdata: